<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle}">User Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { cyber: { dark: '#0a0a1a', purple: '#1a0a2e', neon: '#00f5ff', pink: '#ff00ff', blue: '#00a8ff', green: '#00ff88', red: '#ff0066' } },
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], rajdhani: ['Rajdhani', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%); }
    </style>
</head>
<body class="bg-cyber-dark min-h-screen font-rajdhani">
    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-orbitron font-bold text-cyber-neon" th:text="${formTitle}">USER FORM</h1>
            <a th:href="@{/admin}" class="px-4 py-2 border border-cyber-neon/50 text-cyber-neon hover:bg-cyber-neon/20 rounded-lg font-semibold transition">← BACK</a>
        </header>

        <form th:action="@{${formAction}}" th:object="${user}" method="post" class="bg-cyber-purple/20 border border-cyber-neon/30 rounded-xl p-6 max-w-2xl mx-auto">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="space-y-5">
                <div>
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold tracking-wide">USERNAME *</label>
                    <input type="text" th:field="*{username}" required class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white focus:outline-none focus:border-cyber-neon">
                </div>
                <div>
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold tracking-wide">PASSWORD <span th:if="${user.id != null}" class="text-gray-500 text-xs">(leave blank to keep current)</span></label>
                    <input type="password" th:field="*{password}" th:required="${user.id == null}" class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white focus:outline-none focus:border-cyber-neon">
                </div>
                <div>
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold tracking-wide">FULL NAME</label>
                    <input type="text" th:field="*{fullName}" class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white focus:outline-none focus:border-cyber-neon">
                </div>
                <div>
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold tracking-wide">DEPARTMENT</label>
                    <input type="text" th:field="*{department}" class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white focus:outline-none focus:border-cyber-neon">
                </div>
                <div>
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold tracking-wide">ROLE *</label>
                    <select th:field="*{roles}" multiple required size="3" class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white focus:outline-none focus:border-cyber-neon">
                        <option value="SUPER_ADMIN" class="text-gray-800">SUPER_ADMIN (Full Access)</option>
                        <option value="EDITOR" class="text-gray-800">EDITOR (Add/Edit Records)</option>
                        <option value="VIEWER" class="text-gray-800">VIEWER (View Only)</option>
                    </select>
                    <p class="text-gray-500 text-xs mt-1">Hold Ctrl/Cmd to select multiple roles</p>
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button type="submit" class="flex-1 py-3 bg-cyber-neon/20 border border-cyber-neon text-cyber-neon hover:bg-cyber-neon/30 font-orbitron font-bold rounded-lg transition-all hover:scale-[1.02]">SAVE 💾</button>
                <a th:href="@{/admin}" class="flex-1 text-center py-3 border border-gray-600 text-gray-400 hover:text-white rounded-lg font-semibold transition">CANCEL</a>
            </div>
        </form>
    </div>
</body>
</html>
