<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NSU IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0a0a1a',
                            purple: '#1a0a2e',
                            neon: '#00f5ff',
                            pink: '#ff00ff',
                            blue: '#00a8ff',
                            green: '#00ff88',
                            red: '#ff0066',
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root { --neon-cyan: #00f5ff; }
        body { background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%); }
        .neon-glow { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
        @keyframes neon-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .neon-text { animation: neon-pulse 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-cyber-dark min-h-screen font-rajdhani flex items-center justify-center">
    <div class="w-full max-w-md px-6">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-orbitron font-bold text-cyber-neon neon-glow tracking-wider">NSU IT</h1>
            <p class="text-cyber-blue mt-3 text-xl font-semibold">IP ADDRESS MANAGEMENT</p>
            <p class="text-cyber-neon/60 mt-2 tracking-widest font-orbitron text-sm">SYSTEM ACCESS</p>
        </div>

        <div class="bg-cyber-purple/20 border border-cyber-neon/30 rounded-xl p-8 backdrop-blur">
            <h2 class="text-2xl font-orbitron font-bold text-white text-center mb-6">⚡ AUTHENTICATE</h2>

            <p th:if="${param.error}" class="bg-cyber-red/20 border border-cyber-red/50 text-cyber-red px-4 py-3 rounded-lg mb-4 font-semibold text-center">
                ⚠ INVALID CREDENTIALS
            </p>
            <p th:if="${param.logout}" class="bg-cyber-green/20 border border-cyber-green/50 text-cyber-green px-4 py-3 rounded-lg mb-4 font-semibold text-center">
                ✓ SESSION TERMINATED
            </p>

            <form th:action="@{/login}" method="post">
                <div class="mb-5">
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold tracking-wide">USERNAME</label>
                    <input id="username" name="username" type="text" required autofocus 
                           class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white placeholder-gray-600 focus:outline-none focus:border-cyber-neon focus:shadow-[0_0_15px_rgba(0,245,255,0.3)]">
                </div>

                <div class="mb-6">
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold tracking-wide">PASSWORD</label>
                    <input id="password" name="password" type="password" required
                           class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white placeholder-gray-600 focus:outline-none focus:border-cyber-neon focus:shadow-[0_0_15px_rgba(0,245,255,0.3)]">
                </div>

                <button type="submit" class="w-full py-4 bg-cyber-neon/20 border-2 border-cyber-neon text-cyber-neon font-orbitron font-bold text-lg rounded-lg hover:bg-cyber-neon hover:text-cyber-dark transition-all hover:scale-[1.02] hover:shadow-[0_0_25px_rgba(0,245,255,0.5)]">
                    ENTER 🔐
                </button>
            </form>
        </div>

        <div class="mt-8 text-center">
            <p class="text-gray-500 text-sm font-semibold">DEFAULT CREDENTIALS:</p>
            <div class="mt-3 space-y-2 text-sm">
                <p><span class="text-cyber-neon">superadmin</span> / <span class="text-gray-400">super123</span> <span class="text-cyber-green text-xsml-2">[FULL]</span></p>
                <p><span class="text-cyber-neon">editor</span> / <span class="text-gray-400">editor123</span> <span class="text-cyber-blue text-xs ml-2">[EDIT]</span></p>
                <p><span class="text-cyber-neon">viewer</span> / <span class="text-gray-400">viewer123</span> <span class="text-gray-400 text-xs ml-2">[VIEW]</span></p>
            </div>
        </div>
    </div>
</body>
</html>
