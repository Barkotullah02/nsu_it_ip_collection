<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign IP - NSU IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { cyber: { dark: '#0a0a1a', purple: '#1a0a2e', neon: '#00f5ff', pink: '#ff00ff', blue: '#00a8ff', green: '#00ff88', red: '#ff0066' } },
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], rajdhani: ['Rajdhani', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%); }
    </style>
</head>
<body class="bg-cyber-dark min-h-screen font-rajdhani">
    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-orbitron font-bold text-cyber-neon">ASSIGN TO NEW USER</h1>
            <a th:href="@{/records}" class="px-4 py-2 border border-cyber-neon/50 text-cyber-neon hover:bg-cyber-neon/20 rounded-lg font-semibold transition">← BACK</a>
        </header>

        <div class="bg-cyber-purple/20 border border-cyber-neon/30 rounded-xl p-5 mb-6 max-w-2xl mx-auto">
            <h3 class="text-lg font-orbitron font-bold text-cyber-green mb-3">IP ADDRESS TO ASSIGN</h3>
            <div class="p-4 bg-cyber-dark/50 rounded-lg">
                <p class="font-mono text-cyber-neon text-2xl font-bold text-center" th:text="${record.ipAddress}">192.168.1.1</p>
            </div>
        </div>

        <form th:action="@{${formAction}}" th:object="${record}" method="post" class="bg-cyber-purple/20 border border-cyber-neon/30 rounded-xl p-6 max-w-2xl mx-auto">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h3 class="text-lg font-orbitron font-bold text-cyber-neon mb-4">NEW USER INFORMATION</h3>
            <div class="grid md:grid-cols-2 gap-5">
                <div><label class="block text-cyber-neon text-sm mb-2 font-semibold">SL NUMBER</label><input type="number" th:field="*{sl}" min="1" class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white"></div>
                <div><label class="block text-cyber-neon text-sm mb-2 font-semibold">NAME OF USER *</label><input type="text" th:field="*{name}" maxlength="100" required class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white"></div>
                <div><label class="block text-cyber-neon text-sm mb-2 font-semibold">DESIGNATION *</label><input type="text" th:field="*{designation}" maxlength="100" required class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white"></div>
                <div><label class="block text-cyber-neon text-sm mb-2 font-semibold">EXTENSION</label><input type="text" th:field="*{extNumber}" maxlength="20" class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white"></div>
                <div><label class="block text-cyber-neon text-sm mb-2 font-semibold">ROOM *</label><input type="text" th:field="*{room}" maxlength="50" required class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white"></div>
                <div class="md:col-span-2">
                    <label class="block text-cyber-neon text-sm mb-2 font-semibold">DEPARTMENT *</label>
                    <input type="text" id="departmentInput" name="departmentName" list="departmentList" autocomplete="off"
                           placeholder="Start typing department name..."
                           class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white">
                    <datalist id="departmentList">
                        <option th:each="dept : ${departments}" th:value="${dept}">Department: <span th:text="${dept}"></span></option>
                    </datalist>
                </div>
                <div class="md:col-span-2"><label class="block text-cyber-neon text-sm mb-2 font-semibold">MAC ADDRESS</label><input type="text" th:field="*{macAddress}" placeholder="00:1A:2B:3C:4D:5E" class="w-full px-4 py-3 rounded-lg bg-cyber-dark border border-cyber-neon/30 text-white font-mono"></div>
            </div>
            <div class="flex gap-4 mt-8">
                <button type="submit" class="flex-1 py-3 bg-cyber-green/20 border border-cyber-green/50 text-cyber-green hover:bg-cyber-green/30 font-orbitron font-bold rounded-lg transition-all hover:scale-[1.02]">ASSIGN IP ✓</button>
                <a th:href="@{/records}" class="flex-1 text-center py-3 border border-gray-600 text-gray-400 hover:text-white rounded-lg font-semibold transition">CANCEL</a>
            </div>
        </form>
    </div>
</body>
</html>
