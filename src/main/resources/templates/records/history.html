<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras-spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP History - NSU IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#023e8a',
                        'primary-dark': '#03045e',
                        'primary-light': '#0077b6',
                        accent: '#00b4d8',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-primary-dark via-primary to-primary-light min-h-screen font-poppins">
    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">IP Address History</h1>
                <p class="text-blue-200 mt-1" th:text="${record.ipAddress}">192.168.1.1</p>
            </div>
            <a th:href="@{/records/{id}(id=${record.id})}" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition">Back to Details</a>
        </header>

        <div class="card">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Full Assignment History</h3>

            <div th:if="${#lists.isEmpty(histories)}" class="text-center py-8 text-gray-500">
                No history records found.
            </div>

            <div th:unless="${#lists.isEmpty(histories)}" class="overflow-x-auto">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>SL</th>
                            <th>Name</th>
                            <th>Designation</th>
                            <th>Department</th>
                            <th>Ext.</th>
                            <th>Room</th>
                            <th>MAC Address</th>
                            <th>Assigned Date</th>
                            <th>Released Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="history, iter : ${histories}">
                            <td th:text="${iter.index + 1}">1</td>
                            <td th:text="${history.name}">-</td>
                            <td th:text="${history.designation}">-</td>
                            <td th:text="${history.department}">-</td>
                            <td th:text="${history.extNumber}">-</td>
                            <td th:text="${history.room}">-</td>
                            <td class="font-mono text-xs" th:text="${history.macAddress}">-</td>
                            <td th:text="${#temporals.format(history.assignedAt, 'yyyy-MM-dd')}">-</td>
                            <td>
                                <span th:if="${history.releasedAt != null}" th:text="${#temporals.format(history.releasedAt, 'yyyy-MM-dd')}">-</span>
                                <span th:if="${history.releasedAt == null}" class="text-green-600 font-medium">Current</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
