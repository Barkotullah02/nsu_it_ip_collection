<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras-spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - NSU IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#023e8a',
                        'primary-dark': '#03045e',
                        'primary-light': '#0077b6',
                        accent: '#00b4d8',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-primary-dark via-primary to-primary-light min-h-screen font-poppins">
    <div class="container mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="text-center md:text-left">
                <h1 class="text-3xl md:text-4xl font-bold text-white">User Management</h1>
                <p class="text-blue-200 mt-1">NSU IT Department</p>
            </div>
            <nav class="flex flex-wrap justify-center gap-3">
                <a th:href="@{/records}" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition">IP Records</a>
                <a th:href="@{/users/new}" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition">+ Add User</a>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition">Logout</button>
                </form>
            </nav>
        </header>

        <div th:if="${#lists.isEmpty(users)}" class="bg-white/10 backdrop-blur rounded-xl p-12 text-center">
            <h3 class="text-2xl text-white mb-2">No Users Found</h3>
        </div>

        <div th:unless="${#lists.isEmpty(users)}" class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td class="font-medium" th:text="${user.username}">username</td>
                        <td th:text="${user.fullName}">Full Name</td>
                        <td th:text="${user.department}">IT</td>
                        <td>
                            <span th:each="role : ${user.roles}" th:text="${role}"
                                  class="badge text-xs"
                                  th:classappend="${role == 'SUPER_ADMIN'} ? 'bg-blue-100 text-blue-800' : (${role == 'EDITOR'} ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800')">ROLE</span>
                        </td>
                        <td>
                            <span th:text="${user.isActive ? 'Active' : 'Inactive'}"
                                  class="badge"
                                  th:classappend="${user.isActive} ? 'badge-active' : 'badge-free'">Active</span>
                        </td>
                        <td>
                            <div class="flex flex-wrap gap-2">
                                <a th:href="@{/users/{id}/edit(id=${user.id})}" class="text-blue-600 hover:text-blue-800 text-sm">Edit</a>
                                <a th:href="@{/users/{id}/toggle(id=${user.id})}" class="text-amber-600 hover:text-amber-800 text-sm"
                                   th:text="${user.isActive ? 'Disable' : 'Enable'}">Toggle</a>
                                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" class="inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="text-red-600 hover:text-red-800 text-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
