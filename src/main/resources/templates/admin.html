<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Management</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <header class="toolbar">
        <h1>User Management</h1>
        <nav>
            <a th:href="@{/records}">IP Records</a>
            <a th:href="@{/users/new}">Add User</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </header>

    <div th:if="${#lists.isEmpty(users)}" class="empty-state">
        <h3>No users found</h3>
    </div>

    <div th:unless="${#lists.isEmpty(users)}" class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Department</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}">username</td>
                    <td th:text="${user.fullName}">Full Name</td>
                    <td th:text="${user.department}">IT</td>
                    <td>
                        <span th:each="role : ${user.roles}" th:text="${role}" class="badge"
                              th:classappend="${role == 'SUPER_ADMIN'} ? 'badge-admin' : (${role == 'EDITOR'} ? 'badge-editor' : 'badge-viewer')">ROLE</span>
                    </td>
                    <td>
                        <span th:text="${user.isActive ? 'Active' : 'Inactive'}"
                              th:classappend="${user.isActive ? 'badge-admin' : 'badge-viewer'}"
                              class="badge">Active</span>
                    </td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/users/{id}/edit(id=${user.id})}" style="background: var(--accent); padding: 0.35rem 0.65rem; font-size: 0.85rem;">Edit</a>
                            <a th:href="@{/users/{id}/toggle(id=${user.id})}" style="background: var(--primary-light); padding: 0.35rem 0.65rem; font-size: 0.85rem;"
                               th:text="${user.isActive ? 'Disable' : 'Enable'}">Toggle</a>
                            <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" class="inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="danger" style="padding: 0.35rem 0.65rem; font-size: 0.85rem;">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
